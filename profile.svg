  <text x="24" y="42" class="hot">PLAYER 0</text>
  <text x="976" y="42" class="hot" text-anchor="end">READY</text>
  <rect x="16" y="54" width="968" height="2" fill="#1f8f3a"/>
  <rect x="16" y="59" width="968" height="2" fill="#1f8f3a"/>

  <!-- left column -->
  <text x="24" y="98" class="label">NAME</text>
