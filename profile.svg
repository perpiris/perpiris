<svg xmlns="http://www.w3.org/2000/svg" width="480" height="348" viewBox="0 0 480 348" role="img" aria-label="Player 0: Ioannis, software developer from Crete. Loadout: .NET, Azure, Angular.">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; font-size: 14px; }
    .label { fill: #1f8f3a; }
    .value { fill: #9dffb5; }
    .hot { fill: #39ff6a; font-weight: 700; letter-spacing: 1px; }
    .quest { fill: #39ff6a; }
    .slot { fill: none; stroke: #39ff6a; stroke-width: 1.5; }
  </style>

  <rect x="1" y="1" width="478" height="346" fill="#000000" stroke="#0f3d1c" stroke-width="2"/>

  <!-- header -->
  <rect x="16" y="14" width="448" height="2" fill="#1f8f3a"/>
  <rect x="16" y="19" width="448" height="2" fill="#1f8f3a"/>
  <text x="24" y="42" class="hot">PLAYER 0</text>
  <text x="456" y="42" class="hot" text-anchor="end">READY</text>
  <rect x="16" y="54" width="448" height="2" fill="#1f8f3a"/>
  <rect x="16" y="59" width="448" height="2" fill="#1f8f3a"/>

  <!-- stats -->
  <text x="24" y="92" class="label">NAME</text>
  <text x="120" y="92" class="value">Ioannis</text>
  <text x="24" y="114" class="label">CLASS</text>
  <text x="120" y="114" class="value">Software Developer</text>
  <text x="24" y="136" class="label">REGION</text>
  <text x="120" y="136" class="value">Crete, GR</text>

  <!-- loadout: no levels, just what's equipped -->
  <text x="24" y="172" class="label">LOADOUT</text>
  <rect x="120" y="156" width="64" height="24" class="slot"/>
  <text x="152" y="173" class="quest" text-anchor="middle">.NET</text>
  <rect x="194" y="156" width="72" height="24" class="slot"/>
  <text x="230" y="173" class="quest" text-anchor="middle">Azure</text>
  <rect x="276" y="156" width="88" height="24" class="slot"/>
  <text x="320" y="173" class="quest" text-anchor="middle">Angular</text>

  <!-- inventory -->
  <text x="24" y="208" class="label">INVENTORY</text>
  <text x="120" y="208" class="value">C# · ASP.NET Core · TypeScript</text>
  <text x="120" y="230" class="value">SQL Server · Docker</text>

  <!-- quest -->
  <text x="24" y="266" class="label">QUEST</text>
  <text x="120" y="266" class="quest">kunigi-archive</text>
  <text x="120" y="288" class="label">&gt; archive of a treasure hunt</text>

  <!-- prompt -->
  <text x="24" y="326" class="hot">&gt; PRESS START <tspan>█<animate attributeName="fill-opacity" values="1;0" dur="1.1s" calcMode="discrete" repeatCount="indefinite"/></tspan></text>
</svg>
